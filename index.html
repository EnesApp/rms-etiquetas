<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMS OBRAS & Etiquetas</title>
  <!-- React + Babel + JsBarcode + QRCode + SheetJS (Excel .xlsx) + html5-qrcode via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; background: #eef2f6; color: #111; }
    .topbar {
      background: #1f497d; color: #fff; padding: 10px 16px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .topbar button {
      background: #365f91; color: #fff; border: 1px solid #8fb3de;
      padding: 7px 14px; border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    .topbar button.active { background: #fff; color: #1f497d; }
    .container { max-width: 1280px; margin: 16px auto; padding: 0 12px; }
    .card {
      background: #fff; border-radius: 8px; padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 14px;
    }
    .banner {
      background: #1f497d; color: #fff; text-align: center;
      font-weight: bold; padding: 8px; font-size: 15px; letter-spacing: 0.5px;
    }
    .toolbar-rms {
      margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .search-box {
      flex: 1; min-width: 240px; padding: 7px 10px;
      border: 1px solid #94a3b8; border-radius: 5px; font-size: 13px;
    }
    .search-box:focus {
      border-color: #1f497d; background: #fffef0; outline: none;
    }
    .contador-filtro {
      font-size: 12px; color: #475569; font-weight: bold;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    th {
      background: #2f5597; color: #fff; padding: 7px 6px;
      border: 1px solid #cbd5e1; text-align: center;
    }
    td { border: 1px solid #cbd5e1; padding: 4px; text-align: center; }
    tr.linha-selecionada {
      background: #fef9c3 !important;
      outline: 2px solid #eab308;
    }
    td input, td select {
      width: 100%; border: 1px solid transparent; padding: 4px;
      font-size: 12px; text-align: center; background: transparent;
    }
    td input:focus, td select:focus {
      border: 1px solid #1f497d; background: #fffef0; outline: none;
    }
    .acao-select {
      border: 1px solid #94a3b8 !important;
      border-radius: 4px;
      background: #f8fafc !important;
      font-weight: bold;
      color: #0f172a;
      cursor: pointer;
      padding: 4px 6px !important;
    }
    .status-baia { background: #76933c !important; color: #fff; font-weight: bold; }
    .status-semlista { background: #c0504d !important; color: #fff; font-weight: bold; }

    /* Scanner QR Code na RMS_OBRAS */
    .scanner-box {
      margin-top: 12px; padding: 12px; border: 1px solid #94a3b8;
      border-radius: 8px; background: #f8fafc;
    }
    .scanner-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; gap: 8px; flex-wrap: wrap;
    }
    #qr-reader-rms {
      width: 100%; max-width: 420px; margin: 0 auto;
      border-radius: 6px; overflow: hidden; background: #000;
    }

    /* Tela Etiqueta */
    .controls-row {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px;
    }
    .controls-row label { font-weight: bold; font-size: 13px; }
    .controls-row input, .controls-row select {
      padding: 6px 10px; border: 1px solid #94a3b8; border-radius: 4px; font-size: 13px;
    }
    .hl-yellow { background: #fff2cc !important; font-weight: bold; }

    /* Proporção de etiqueta 102mm x 50mm (largura ~2x altura) */
    .etiqueta-box {
      width: 480px; max-width: 100%; border: 2px solid #000; background: #fff;
      padding: 4px 6px 0 6px; margin: 8px 0 14px 0; overflow: hidden;
    }
    .etq-obra {
      text-align: center; font-size: 20px; font-weight: bold; line-height: 1.1;
      border-bottom: 1px solid #cbd5e1; padding-bottom: 2px;
    }
    .etq-barcode {
      text-align: center; border-bottom: 1px solid #cbd5e1; padding: 2px 0; min-height: 28px;
      display: flex; align-items: center; justify-content: center;
    }
    .etq-barcode svg {
      width: 100%; max-width: 440px; height: 24px; display: block;
    }
    .etq-sem-pat {
      font-size: 10px; color: #64748b; font-style: italic;
    }
    .etq-body-row {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #cbd5e1; padding: 2px 0;
    }
    .etq-info { flex: 1; padding: 1px 4px; text-align: center; line-height: 1.22; }
    .etq-pat { font-size: 13px; font-weight: bold; margin: 1px 0; }
    .etq-sub { font-size: 9.5px; margin: 1px 0; }
    .etq-rm { font-size: 10.5px; font-weight: bold; margin: 1px 0; }
    .etq-status { font-size: 9.5px; font-weight: bold; margin: 1px 0; }
    .etq-qr-area {
      width: 68px; min-width: 68px; display: flex; align-items: center; justify-content: center;
      border-left: 1px solid #cbd5e1; padding: 2px; background: #fff;
    }
    .etq-qr-area canvas, .etq-qr-area img {
      width: 58px !important; height: 58px !important; display: block;
    }
    .etq-footer {
      background: #1f497d; color: #fff; text-align: center;
      font-weight: bold; font-size: 10px; line-height: 1.15;
      padding: 3px 4px; margin: 0 -6px;
    }
    .btn-print {
      background: #365f91; color: #fff; border: 2px solid #1f497d;
      padding: 10px 20px; font-size: 13px; font-weight: bold; font-style: italic;
      border-radius: 6px; cursor: pointer;
    }
    .btn-cam {
      background: #1d4ed8; color: #fff; border: none; padding: 7px 12px;
      border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    .btn-add {
      background: #1e7e34; color: #fff; border: none; padding: 7px 12px;
      border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    .btn-import {
      background: #b45309; color: #fff; border: none; padding: 7px 12px;
      border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    .btn-excel {
      background: #0f766e; color: #fff; border: none; padding: 7px 12px;
      border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    .btn-reset {
      background: #64748b; color: #fff; border: none; padding: 7px 12px;
      border-radius: 5px; cursor: pointer; font-weight: bold;
    }
    .btn-clear {
      background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; padding: 7px 10px;
      border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px;
    }
    .msg-alerta {
      margin-top: 8px; padding: 8px 12px; border-radius: 5px;
      background: #fef3c7; border: 1px solid #f59e0b; font-size: 13px;
    }
    .msg-sucesso {
      margin-top: 8px; padding: 8px 12px; border-radius: 5px;
      background: #dcfce7; border: 1px solid #22c55e; color: #14532d; font-size: 13px; font-weight: bold;
    }

    /* Impressão térmica exata 102mm x 50mm em 1 única etiqueta */
    @page {
      size: 102mm 50mm;
      margin: 0;
    }

    @media print {
      html, body {
        width: 102mm;
        height: 50mm;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        overflow: hidden !important;
      }
      .topbar, .no-print, .msg-alerta, .msg-sucesso, .scanner-box { display: none !important; }
      .container {
        width: 102mm !important;
        height: 50mm !important;
        margin: 0 !important;
        padding: 0 !important;
        max-width: 102mm !important;
      }
      .card {
        width: 102mm !important;
        height: 50mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        background: #fff !important;
      }
      .etiqueta-box {
        width: 98mm !important;
        max-width: 98mm !important;
        height: 46mm !important;
        max-height: 46mm !important;
        margin: 2mm auto !important;
        padding: 1mm 1.5mm 0 1.5mm !important;
        border: 1pt solid #000 !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
      }
      .etq-obra {
        font-size: 13pt !important;
        line-height: 1.05 !important;
        padding-bottom: 0.5mm !important;
      }
      .etq-barcode {
        min-height: 8mm !important;
        padding: 0.5mm 0 !important;
      }
      .etq-barcode svg {
        width: 92mm !important;
        max-width: 92mm !important;
        height: 7.5mm !important;
      }
      .etq-body-row {
        flex: 1 !important;
        padding: 0.5mm 0 !important;
      }
      .etq-info {
        padding: 0 1mm !important;
        line-height: 1.15 !important;
      }
      .etq-pat { font-size: 8.8pt !important; margin: 0 !important; }
      .etq-sub { font-size: 6.5pt !important; margin: 0.3mm 0 !important; }
      .etq-rm { font-size: 7.5pt !important; margin: 0 !important; }
      .etq-status { font-size: 6.5pt !important; margin: 0 !important; }
      .etq-qr-area {
        width: 16mm !important;
        min-width: 16mm !important;
        padding: 0.5mm !important;
      }
      .etq-qr-area canvas, .etq-qr-area img {
        width: 14mm !important;
        height: 14mm !important;
      }
      .etq-footer {
        font-size: 6.8pt !important;
        line-height: 1.1 !important;
        padding: 1mm 2mm !important;
        margin: 0 -1.5mm !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DADOS_INICIAIS = [
      { id: 1, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 5, descricao: "TECLADO", data: "2026-11-10", setor: "ENESA", obra: "124", status: "SEPARAÇÃO NA BAIA", rms: "119370", idProduto: "11909" },
      { id: 2, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 5, descricao: "MOUSER", data: "2026-11-17", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "11795" },
      { id: 3, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 5, descricao: "TECLADO", data: "2026-11-18", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "11909" },
      { id: 4, patrimonio: "02569-0762", patrimonio2: "", qtd: 1, descricao: "MONITOR", data: "2026-11-18", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "17351" },
      { id: 5, patrimonio: "02569-1170", patrimonio2: "", qtd: 1, descricao: "MONITOR", data: "2026-11-18", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "17351" },
      { id: 6, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 10, descricao: "MOUSER", data: "2026-11-23", setor: "ENESA", obra: "129", status: "SEPARAÇÃO NA BAIA", rms: "120012", idProduto: "11795" }
    ];

    function formatarDataBR(isoDate) {
      if (!isoDate) return "";
      const partes = String(isoDate).split("-");
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return isoDate;
    }

    function converterDataParaISO(valor) {
      if (!valor) return hojeISO();
      if (typeof valor === "number") {
        const utcDays = Math.floor(valor - 25569);
        const dt = new Date(utcDays * 86400 * 1000);
        const yyyy = dt.getUTCFullYear();
        const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
        const dd = String(dt.getUTCDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }
      const str = String(valor).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      const partesBR = str.split("/");
      if (partesBR.length === 3) {
        const dd = partesBR[0].padStart(2, "0");
        const mm = partesBR[1].padStart(2, "0");
        const yyyy = partesBR[2].length === 2 ? `20${partesBR[2]}` : partesBR[2];
        return `${yyyy}-${mm}-${dd}`;
      }
      return hojeISO();
    }

    function hojeISO() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${d.getFullYear()}-${mm}-${dd}`;
    }

    function temPatrimonioValido(pat) {
      const txt = String(pat || "").trim();
      if (!txt) return false;
      const lower = txt.toLowerCase();
      return !lower.includes("não relacionado") && !lower.includes("nao relacionado") && !lower.includes("não informado") && !lower.includes("nao informado");
    }

    // Extrai PAT, RM e ID (ID do Produto) de um texto de QR Code ou URL
    function parsearDadosQR(textoBruto) {
      const raw = String(textoBruto || "").trim();
      if (!raw) return { pat: "", rm: "", idProd: "", termoFiltro: "" };

      try {
        if (raw.startsWith("http://") || raw.startsWith("https://")) {
          const url = new URL(raw);
          const patUrl = (url.searchParams.get("pat") || "").trim();
          const rmUrl = (url.searchParams.get("rm") || "").trim();
          const idProdUrl = (url.searchParams.get("idProd") || url.searchParams.get("id") || "").trim();
          const termoFiltro = idProdUrl || patUrl || rmUrl || raw;
          return { pat: patUrl, rm: rmUrl, idProd: idProdUrl, termoFiltro };
        }
      } catch (e) {}

      const patMatch = raw.match(/PAT\s*:\s*([^|]+)/i);
      const rmMatch = raw.match(/RM\s*:\s*([^|]+)/i);
      const idMatch = raw.match(/ID\s*:\s*([^|]+)/i);

      const pat = patMatch ? patMatch[1].trim() : "";
      const rm = rmMatch ? rmMatch[1].trim() : "";
      const idProd = idMatch ? idMatch[1].trim() : "";

      const patLimpo = temPatrimonioValido(pat) ? pat : "";
      const termoFiltro = idProd || patLimpo || rm || raw;

      return { pat: patLimpo, rm, idProd, termoFiltro };
    }

    function App() {
      const [aba, setAba] = useState("Etiqueta");
      const [itens, setItens] = useState(() => {
        const salvo = localStorage.getItem("rms_obras_itens_v1");
        return salvo ? JSON.parse(salvo) : DADOS_INICIAIS;
      });
      const [pesquisa, setPesquisa] = useState("");
      const [linhaSelecionadaId, setLinhaSelecionadaId] = useState(4);
      const [eqpSelecionado, setEqpSelecionado] = useState(4);
      const [codBarrasInput, setCodBarrasInput] = useState("");
      const [aviso, setAviso] = useState("");
      const [statusLeitura, setStatusLeitura] = useState("");
      const [cameraAtiva, setCameraAtiva] = useState(false);

      const barcodeRef = useRef(null);
      const qrRef = useRef(null);
      const bipInputRef = useRef(null);
      const fileInputRef = useRef(null);
      const scannerInstanceRef = useRef(null);

      useEffect(() => {
        localStorage.setItem("rms_obras_itens_v1", JSON.stringify(itens));
      }, [itens]);

      // Lê parâmetros da URL caso o celular abra o link vindo do QR Code
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const patParam = (params.get("pat") || "").trim();
        const rmParam = (params.get("rm") || "").trim();
        const idProdParam = (params.get("idProd") || params.get("id") || "").trim();

        if (patParam || rmParam || idProdParam) {
          setAba("RMS_OBRAS");
          aplicarBuscaESelecao({ pat: patParam, rm: rmParam, idProd: idProdParam }, itens);
        }
      }, []);

      function aplicarBuscaESelecao(dadosQR, listaItens) {
        const { pat, rm, idProd, termoFiltro } = dadosQR;
        const busca = termoFiltro || idProd || pat || rm;
        setPesquisa(busca);

        const encontrado = listaItens.find((r) => {
          if (idProd && String(r.idProduto || "").trim().toLowerCase() === idProd.toLowerCase()) return true;
          if (pat && String(r.patrimonio || "").trim().toLowerCase() === pat.toLowerCase()) return true;
          if (rm && String(r.rms || "").trim().toLowerCase() === rm.toLowerCase()) return true;
          return false;
        });

        if (encontrado) {
          setLinhaSelecionadaId(encontrado.id);
          setEqpSelecionado(encontrado.id);
          setAviso("");
          setStatusLeitura(
            `Selecionado: EQP ${encontrado.id} — ${encontrado.descricao || "Item"} (ID Produto: ${encontrado.idProduto || "-"} | PAT: ${encontrado.patrimonio || "-"} | RM: ${encontrado.rms || "-"})`
          );
        } else {
          setAviso(`Filtro aplicado com "${busca}", mas nenhum item exato foi encontrado na lista atual.`);
          setStatusLeitura("");
        }
      }

      // Controla abertura/fechamento da câmera para ler QR Code na aba RMS_OBRAS
      useEffect(() => {
        if (!cameraAtiva || aba !== "RMS_OBRAS") {
          if (scannerInstanceRef.current) {
            scannerInstanceRef.current.stop().catch(() => {}).finally(() => {
              scannerInstanceRef.current = null;
            });
          }
          return;
        }

        if (typeof Html5Qrcode === "undefined") {
          setAviso("Biblioteca da câmera não carregou. Verifique a conexão com a internet.");
          setCameraAtiva(false);
          return;
        }

        const html5QrCode = new Html5Qrcode("qr-reader-rms");
        scannerInstanceRef.current = html5QrCode;

        html5QrCode
          .start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            (decodedText) => {
              const dados = parsearDadosQR(decodedText);
              aplicarBuscaESelecao(dados, itens);
              setCameraAtiva(false);
            },
            () => {}
          )
          .catch(() => {
            setAviso("Não foi possível acessar a câmera. Permita o uso da câmera no navegador ou use em HTTPS.");
            setCameraAtiva(false);
          });

        return () => {
          if (scannerInstanceRef.current) {
            scannerInstanceRef.current.stop().catch(() => {}).finally(() => {
              scannerInstanceRef.current = null;
            });
          }
        };
      }, [cameraAtiva, aba]);

      const itemAtual = itens.find((r) => String(r.id) === String(eqpSelecionado)) || null;
      const patValido = itemAtual ? temPatrimonioValido(itemAtual.patrimonio) : false;

      const termoBusca = pesquisa.trim().toLowerCase();
      const itensFiltrados = itens
        .map((row, index) => ({ row, index }))
        .filter(({ row }) => {
          if (!termoBusca) return true;
          const campos = [
            row.id,
            row.patrimonio,
            row.patrimonio2,
            row.qtd,
            row.descricao,
            row.data,
            formatarDataBR(row.data),
            row.setor,
            row.obra,
            row.status,
            row.rms,
            row.idProduto
          ];
          return campos.some((val) => String(val ?? "").toLowerCase().includes(termoBusca));
        });

      useEffect(() => {
        if (aba !== "Etiqueta") return;

        if (barcodeRef.current) {
          barcodeRef.current.innerHTML = "";
          if (itemAtual) {
            if (patValido) {
              const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
              barcodeRef.current.appendChild(svg);
              try {
                JsBarcode(svg, `${itemAtual.id}-${String(itemAtual.patrimonio).trim()}`, {
                  format: "CODE128",
                  width: 1.5,
                  height: 28,
                  displayValue: false,
                  margin: 1
                });
              } catch (e) {
                barcodeRef.current.innerHTML = `<span class="etq-sem-pat">Sem código de barras</span>`;
              }
            } else {
              barcodeRef.current.innerHTML = `<span class="etq-sem-pat">Patrimônio não relacionado (sem código de barras)</span>`;
            }
          }
        }

        if (qrRef.current) {
          qrRef.current.innerHTML = "";
          if (itemAtual) {
            const patTexto = patValido ? String(itemAtual.patrimonio).trim() : "Não Relacionado";
            const baseUrl = window.location.href.split("?")[0];
            const query = new URLSearchParams({
              pat: patValido ? patTexto : "",
              rm: String(itemAtual.rms || "").trim(),
              idProd: String(itemAtual.idProduto || "").trim()
            });
            const textoQR = `${baseUrl}?${query.toString()}`;
            try {
              new QRCode(qrRef.current, {
                text: textoQR,
                width: 96,
                height: 96,
                correctLevel: QRCode.CorrectLevel.M
              });
            } catch (e) {}
          }
        }
      }, [aba, itemAtual, patValido]);

      function processarLeituraCodigoBarras(valorBruto) {
        const lido = String(valorBruto || "").trim();
        if (!lido) return;

        let achado = null;
        if (lido.includes("-") && lido.length > 6) {
          const partes = lido.split("-");
          if (partes.length >= 3) {
            const patBusca = `${partes[1]}-${partes[2]}`;
            achado = itens.find((r) => String(r.patrimonio).trim() === patBusca);
          }
          if (!achado && !isNaN(Number(partes[0]))) {
            achado = itens.find((r) => Number(r.id) === Number(partes[0]));
          }
        } else if (lido.includes("-")) {
          achado = itens.find((r) => String(r.patrimonio).trim() === lido);
        } else {
          achado = itens.find((r) => String(r.id).trim() === lido);
        }

        if (achado) {
          setEqpSelecionado(achado.id);
          setLinhaSelecionadaId(achado.id);
          setAviso("");
        } else {
          setAviso(`Código '${lido}' não encontrado na RMS_OBRAS.`);
        }

        setCodBarrasInput("");
        setTimeout(() => {
          if (bipInputRef.current) bipInputRef.current.focus();
        }, 10);
      }

      function atualizarCampoItem(index, campo, valor) {
        setItens((prev) => {
          const copia = [...prev];
          const anterior = index > 0 ? copia[index - 1] : null;
          let novoValor = valor;

          if (campo === "patrimonio") {
            const limpo = String(valor).trim();
            if (/^\d{4}$/.test(limpo)) {
              let prefixo = "02562-";
              if (anterior && anterior.patrimonio && anterior.patrimonio.includes("-")) {
                prefixo = anterior.patrimonio.slice(0, anterior.patrimonio.indexOf("-") + 1);
              }
              novoValor = `${prefixo}${limpo}`;
            } else if (/^\d{4,5}$/.test(limpo) && !limpo.includes("-")) {
              novoValor = limpo.length === 4 ? `0${limpo}-` : `${limpo}-`;
            }

            if (limpo !== "" && anterior) {
              if (!copia[index].obra) copia[index].obra = anterior.obra || "";
              if (!copia[index].status) copia[index].status = anterior.status || "SEPARAÇÃO NA BAIA";
              if (!copia[index].data) copia[index].data = hojeISO();
            }
          }

          copia[index] = { ...copia[index], [campo]: novoValor };
          return copia;
        });
      }

      function adicionarLinha() {
        setItens((prev) => {
          const ultimo = prev[prev.length - 1];
          const proximoId = prev.reduce((max, r) => Math.max(max, Number(r.id) || 0), 0) + 1;
          return [
            ...prev,
            {
              id: proximoId,
              patrimonio: "",
              patrimonio2: "",
              qtd: 1,
              descricao: "",
              data: hojeISO(),
              setor: ultimo ? ultimo.setor : "ENESA",
              obra: ultimo ? ultimo.obra : "",
              status: ultimo ? ultimo.status : "SEPARAÇÃO NA BAIA",
              rms: ultimo ? ultimo.rms : "",
              idProduto: ""
            }
          ];
        });
      }

      function excluirLinha(index) {
        setItens((prev) => {
          const removida = prev[index];
          const restante = prev.filter((_, i) => i !== index);
          if (removida && String(removida.id) === String(eqpSelecionado)) {
            setEqpSelecionado(restante.length > 0 ? restante[0].id : "");
          }
          if (removida && String(removida.id) === String(linhaSelecionadaId)) {
            setLinhaSelecionadaId(restante.length > 0 ? restante[0].id : null);
          }
          return restante;
        });
      }

      function executarAcaoLinha(acao, row, index) {
        if (acao === "etiqueta") {
          setEqpSelecionado(row.id);
          setLinhaSelecionadaId(row.id);
          setAviso("");
          setAba("Etiqueta");
        } else if (acao === "excluir") {
          excluirLinha(index);
        }
      }

      function importarExcelRMS(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const nomeAba = workbook.SheetNames.includes("RMS_OBRAS")
              ? "RMS_OBRAS"
              : workbook.SheetNames[0];
            const ws = workbook.Sheets[nomeAba];
            const linhas = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

            let idxCabecalho = linhas.findIndex((row) =>
              row.some((c) => String(c).trim().toLowerCase() === "id") &&
              row.some((c) => String(c).trim().toLowerCase().includes("patrimonio"))
            );

            let linhasDados = [];
            if (idxCabecalho >= 0) {
              const cab = linhas[idxCabecalho].map((h) => String(h).trim().toLowerCase());
              const colIdx = (nomes) => cab.findIndex((c) => nomes.some((n) => c.includes(n)));

              const iId = colIdx(["id"]);
              const iPat = colIdx(["patrimonio2"]) >= 0 && cab.filter((x) => x.includes("patrimonio")).length > 1
                ? cab.findIndex((x) => x.includes("patrimonio") && !x.includes("2"))
                : colIdx(["patrimonio"]);
              const iPat2 = colIdx(["patrimonio2"]);
              const iQtd = colIdx(["qtd"]);
              const iDesc = colIdx(["descri"]);
              const iData = colIdx(["data"]);
              const iSetor = colIdx(["setor"]);
              const iObra = colIdx(["obra"]);
              const iStatus = colIdx(["status"]);
              const iRms = colIdx(["rms"]);
              const iIdProd = colIdx(["produto", "id produto"]);

              linhasDados = linhas.slice(idxCabecalho + 1).filter((r) =>
                r.some((v) => String(v).trim() !== "")
              ).map((r, pos) => ({
                id: iId >= 0 && String(r[iId]).trim() !== "" ? Number(r[iId]) || (pos + 1) : (pos + 1),
                patrimonio: iPat >= 0 ? String(r[iPat]).trim() : "",
                patrimonio2: iPat2 >= 0 ? String(r[iPat2]).trim() : "",
                qtd: iQtd >= 0 && r[iQtd] !== "" ? Number(r[iQtd]) || 1 : 1,
                descricao: iDesc >= 0 ? String(r[iDesc]).trim() : "",
                data: iData >= 0 ? converterDataParaISO(r[iData]) : hojeISO(),
                setor: iSetor >= 0 && String(r[iSetor]).trim() !== "" ? String(r[iSetor]).trim() : "ENESA",
                obra: iObra >= 0 ? String(r[iObra]).trim() : "",
                status: iStatus >= 0 && String(r[iStatus]).trim() !== "" ? String(r[iStatus]).trim() : "SEPARAÇÃO NA BAIA",
                rms: iRms >= 0 ? String(r[iRms]).trim() : "",
                idProduto: iIdProd >= 0 ? String(r[iIdProd]).trim() : ""
              }));
            } else {
              linhasDados = linhas.filter((r) => r.some((v) => String(v).trim() !== "")).map((r, pos) => ({
                id: String(r[0]).trim() !== "" && !isNaN(Number(r[0])) ? Number(r[0]) : (pos + 1),
                patrimonio: String(r[1] || "").trim(),
                patrimonio2: String(r[2] || "").trim(),
                qtd: r[3] !== "" ? Number(r[3]) || 1 : 1,
                descricao: String(r[4] || "").trim(),
                data: converterDataParaISO(r[5]),
                setor: String(r[7] || r[6] || "ENESA").trim(),
                obra: String(r[8] || r[7] || "").trim(),
                status: String(r[9] || r[8] || "SEPARAÇÃO NA BAIA").trim(),
                rms: String(r[10] || r[9] || "").trim(),
                idProduto: String(r[11] || r[10] || "").trim()
              }));
            }

            if (linhasDados.length === 0) {
              setAviso("Nenhum item válido encontrado na planilha selecionada.");
              return;
            }

            setItens(linhasDados);
            setEqpSelecionado(linhasDados[0].id);
            setLinhaSelecionadaId(linhasDados[0].id);
            setAviso(`Importados ${linhasDados.length} itens da planilha '${file.name}'.`);
          } catch (err) {
            setAviso("Erro ao ler o arquivo Excel. Verifique se o formato é .xlsx, .xls, .xlsm ou .csv.");
          } finally {
            event.target.value = "";
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function exportarExcelRMS() {
        const linhasExcel = [
          ["RELAÇÃO ATENDIMENTO - RMS OBRAS"],
          [],
          ["ID", "Patrimonio", "Patrimonio2", "QTD:", "DESCRIÇÃO", "DATA:", "SETOR", "OBRA", "STATUS", "RMS", "ID PRODUTO"],
          ...itens.map((r) => [
            r.id,
            r.patrimonio,
            r.patrimonio2,
            Number(r.qtd) || 0,
            r.descricao,
            formatarDataBR(r.data),
            r.setor,
            r.obra,
            r.status,
            r.rms,
            r.idProduto
          ])
        ];

        const ws = XLSX.utils.aoa_to_sheet(linhasExcel);

        ws["!cols"] = [
          { wch: 6 },
          { wch: 18 },
          { wch: 16 },
          { wch: 8 },
          { wch: 24 },
          { wch: 14 },
          { wch: 12 },
          { wch: 10 },
          { wch: 22 },
          { wch: 12 },
          { wch: 14 }
        ];

        ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 10 } }];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "RMS_OBRAS");

        const dataHoje = hojeISO();
        XLSX.writeFile(wb, `RMS_OBRAS_${dataHoje}.xlsx`);
      }

      function imprimirEtiqueta() {
        if (!itemAtual) {
          alert(`O EQP ${eqpSelecionado} não foi encontrado na aba 'RMS_OBRAS'.`);
          return;
        }
        window.print();
      }

      return (
        <div>
          <div className="topbar">
            <strong>SISTEMA RMS OBRAS</strong>
            <button
              className={aba === "RMS_OBRAS" ? "active" : ""}
              onClick={() => setAba("RMS_OBRAS")}
            >
              RMS_OBRAS
            </button>
            <button
              className={aba === "Etiqueta" ? "active" : ""}
              onClick={() => {
                setCameraAtiva(false);
                setAba("Etiqueta");
              }}
            >
              Etiqueta
            </button>
          </div>

          <div className="container">
            {aba === "RMS_OBRAS" && (
              <div className="card">
                <div className="banner">RELAÇÃO ATENDIMENTO - RMS OBRAS</div>
                <div className="toolbar-rms">
                  <input
                    type="text"
                    className="search-box"
                    placeholder="Pesquisar em qualquer coluna (ID, Patrimônio, Descrição, Obra, RMS, ID Produto, Status...)"
                    value={pesquisa}
                    onChange={(e) => {
                      const val = e.target.value;
                      setPesquisa(val);
                      if (!val.trim()) setStatusLeitura("");
                    }}
                  />
                  <button
                    type="button"
                    className="btn-cam"
                    onClick={() => {
                      setAviso("");
                      setCameraAtiva((prev) => !prev);
                    }}
                  >
                    {cameraAtiva ? "Fechar Câmera" : "Ler QR Code / Câmera"}
                  </button>
                  {pesquisa && (
                    <button
                      type="button"
                      className="btn-clear"
                      onClick={() => {
                        setPesquisa("");
                        setStatusLeitura("");
                        setAviso("");
                      }}
                    >
                      Limpar
                    </button>
                  )}
                  <span className="contador-filtro">
                    Exibindo {itensFiltrados.length} de {itens.length}
                  </span>
                </div>

                {cameraAtiva && (
                  <div className="scanner-box">
                    <div className="scanner-header">
                      <strong>Aponte a câmera para o QR Code da etiqueta</strong>
                      <button
                        type="button"
                        className="btn-clear"
                        onClick={() => setCameraAtiva(false)}
                      >
                        Cancelar
                      </button>
                    </div>
                    <div id="qr-reader-rms"></div>
                  </div>
                )}

                <div style={{ marginTop: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button className="btn-add" onClick={adicionarLinha}>+ Nova Linha</button>
                  <button className="btn-import" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
                    Importar Excel (.xlsx)
                  </button>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".xlsx,.xls,.xlsm,.csv"
                    style={{ display: "none" }}
                    onChange={importarExcelRMS}
                  />
                  <button className="btn-excel" onClick={exportarExcelRMS}>Exportar Excel (.xlsx)</button>
                  <button
                    className="btn-reset"
                    onClick={() => {
                      localStorage.removeItem("rms_obras_itens_v1");
                      setItens(DADOS_INICIAIS);
                      setPesquisa("");
                      setStatusLeitura("");
                      setAviso("");
                    }}
                  >
                    Restaurar Exemplo Inicial
                  </button>
                </div>

                {statusLeitura && <div className="msg-sucesso">{statusLeitura}</div>}
                {aviso && <div className="msg-alerta">{aviso}</div>}

                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Patrimonio</th>
                      <th>Patrimonio2</th>
                      <th>QTD:</th>
                      <th>DESCRIÇÃO</th>
                      <th>DATA:</th>
                      <th>SETOR</th>
                      <th>OBRA</th>
                      <th>STATUS</th>
                      <th>RMS</th>
                      <th>ID PRODUTO</th>
                      <th>Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {itensFiltrados.map(({ row, index }) => {
                      const selecionada = String(row.id) === String(linhaSelecionadaId);
                      return (
                        <tr
                          key={row.id}
                          className={selecionada ? "linha-selecionada" : ""}
                          onClick={() => {
                            setLinhaSelecionadaId(row.id);
                            setEqpSelecionado(row.id);
                          }}
                        >
                          <td>{row.id}</td>
                          <td>
                            <input
                              value={row.patrimonio}
                              placeholder="Ex: 1450 ou 02569-0762"
                              onChange={(e) => atualizarCampoItem(index, "patrimonio", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.patrimonio2}
                              onChange={(e) => atualizarCampoItem(index, "patrimonio2", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              type="number"
                              value={row.qtd}
                              onChange={(e) => atualizarCampoItem(index, "qtd", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.descricao}
                              onChange={(e) => atualizarCampoItem(index, "descricao", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              type="date"
                              value={row.data}
                              onChange={(e) => atualizarCampoItem(index, "data", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.setor}
                              onChange={(e) => atualizarCampoItem(index, "setor", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.obra}
                              onChange={(e) => atualizarCampoItem(index, "obra", e.target.value)}
                            />
                          </td>
                          <td>
                            <select
                              className={row.status === "SEPARAÇÃO SEM LISTA" ? "status-semlista" : "status-baia"}
                              value={row.status}
                              onChange={(e) => atualizarCampoItem(index, "status", e.target.value)}
                            >
                              <option value="SEPARAÇÃO NA BAIA">SEPARAÇÃO NA BAIA</option>
                              <option value="SEPARAÇÃO SEM LISTA">SEPARAÇÃO SEM LISTA</option>
                            </select>
                          </td>
                          <td>
                            <input
                              value={row.rms}
                              onChange={(e) => atualizarCampoItem(index, "rms", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.idProduto}
                              onChange={(e) => atualizarCampoItem(index, "idProduto", e.target.value)}
                            />
                          </td>
                          <td onClick={(e) => e.stopPropagation()}>
                            <select
                              className="acao-select"
                              value=""
                              onChange={(e) => {
                                const escolha = e.target.value;
                                e.target.value = "";
                                executarAcaoLinha(escolha, row, index);
                              }}
                            >
                              <option value="" disabled>Ação...</option>
                              <option value="etiqueta">Etiqueta</option>
                              <option value="excluir">Excluir</option>
                            </select>
                          </td>
                        </tr>
                      );
                    })}
                    {itensFiltrados.length === 0 && (
                      <tr>
                        <td colSpan="12" style={{ padding: 14, color: "#64748b" }}>
                          Nenhum registro encontrado para "{pesquisa}".
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {aba === "Etiqueta" && (
              <div className="card">
                <div className="controls-row no-print">
                  <label>EQP Selecionado:</label>
                  <input
                    type="number"
                    className="hl-yellow"
                    style={{ width: 70, textAlign: "center" }}
                    value={eqpSelecionado}
                    onChange={(e) => {
                      setEqpSelecionado(e.target.value);
                      setLinhaSelecionadaId(e.target.value);
                    }}
                  />

                  <select
                    value={itemAtual ? String(itemAtual.id) : ""}
                    onChange={(e) => {
                      setEqpSelecionado(e.target.value);
                      setLinhaSelecionadaId(e.target.value);
                    }}
                    title="Escolha rápida da lista RMS_OBRAS"
                  >
                    {itens.map((r) => (
                      <option key={r.id} value={String(r.id)}>
                        ID {r.id} — {r.descricao || "Item"} ({r.patrimonio || "Sem Pat."})
                      </option>
                    ))}
                  </select>

                  <label>Cod Barras Selecionado:</label>
                  <input
                    ref={bipInputRef}
                    className="hl-yellow"
                    style={{ width: 190 }}
                    placeholder="Bipe ou digite e dê Enter"
                    value={codBarrasInput}
                    onChange={(e) => setCodBarrasInput(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        processarLeituraCodigoBarras(codBarrasInput);
                      }
                    }}
                  />
                  <button onClick={() => processarLeituraCodigoBarras(codBarrasInput)}>Buscar</button>
                </div>

                {aviso && <div className="msg-alerta no-print">{aviso}</div>}

                {itemAtual ? (
                  <div className="etiqueta-box">
                    <div className="etq-obra">OBRA: {itemAtual.obra}</div>
                    <div className="etq-barcode" ref={barcodeRef}></div>
                    <div className="etq-body-row">
                      <div className="etq-info">
                        <div className="etq-pat">Patrimônio: {itemAtual.patrimonio}</div>
                        <div className="etq-sub">
                          QTD: {itemAtual.qtd} ( {itemAtual.descricao}) DATA: {formatarDataBR(itemAtual.data)} / {itemAtual.setor}
                        </div>
                        <div className="etq-rm">
                          RM: {itemAtual.rms} | ID do Produto: {itemAtual.idProduto}
                        </div>
                        <div className="etq-status">STATUS: {itemAtual.status}</div>
                      </div>
                      <div className="etq-qr-area">
                        <div ref={qrRef}></div>
                      </div>
                    </div>
                    <div className="etq-footer">★ CONFERIDO POR EMERSON ★</div>
                  </div>
                ) : (
                  <div className="msg-alerta">EQP "{eqpSelecionado}" não encontrado na RMS_OBRAS.</div>
                )}

                <div className="no-print">
                  <button className="btn-print" onClick={imprimirEtiqueta}>
                    IMPRIMIR EQP ETIQUETA
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
