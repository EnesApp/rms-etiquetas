  <style>

    /* Tela Etiqueta */

    }
    .controls-row label { font-weight: bold; font-size: 13px; }
    .controls-row input, .controls-row select {

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMsg: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMsg: String(error && error.message ? error.message : error) };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="container">
              <div className="card">
                <div className="banner">RECUPERAÇÃO DO SISTEMA</div>
                <p style={{ marginTop: 12 }}>
                  Ocorreu um erro ao carregar a tela ({this.state.errorMsg}). Clique abaixo para restaurar os dados locais e recarregar.
                </p>
                <button
                  className="btn-reset"
                  onClick={() => {
                    try {
                      localStorage.removeItem("inventario_ti_itens_v1");
                      localStorage.removeItem("rms_obras_itens_v1");
                    } catch (e) {}
                    window.location.reload();
                  }}
                >
                  Restaurar e Recarregar
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const INVENTARIO_INICIAL = [
      { id: 1, patrimonio: "02562-1298", patrimonio2: "", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "8GB", armazenamento: "Sem Armazenamento", localEqp: "TI.09A2", status: "Em estoque Funcionando", data: "2026-10-29" },
      { id: 2, patrimonio: "02562-0862", patrimonio2: "02562-0118", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "8GB", armazenamento: "1TB", localEqp: "TI.09A2", status: "Em estoque Funcionando", data: "2026-10-29" },
      { id: 3, patrimonio: "02562-1152", patrimonio2: "", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "Sem Memoria", armazenamento: "Sem Armazenamento", localEqp: "TI.09A2", status: "Em estoque", data: "2026-11-04" },
      { id: 4, patrimonio: "02562-1698", patrimonio2: "", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "6GB", armazenamento: "320GB", localEqp: "TI.09A2", status: "Em estoque Inoperante", data: "2026-11-04" },
      { id: 5, patrimonio: "02562-1329", patrimonio2: "", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "8GB", armazenamento: "320GB", localEqp: "TI.09A2", status: "Em estoque Funcionando", data: "2026-11-04" },
      { id: 6, patrimonio: "02562-1119", patrimonio2: "", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "8GB", armazenamento: "320GB", localEqp: "TI.09A2", status: "Em estoque Funcionando", data: "2026-11-19" },
      { id: 7, patrimonio: "02562-1122", patrimonio2: "", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "4GB", armazenamento: "1TB", localEqp: "TI.09A2", status: "Em estoque Funcionando", data: "2026-11-19" },
      { id: 8, patrimonio: "02562-1237", patrimonio2: "", tipo: "CPU", modelo: "HP Compaq 8100 Elite", processador: "Core i5 650", ram: "8GB", armazenamento: "320GB", localEqp: "TI.09A2", status: "Em estoque Funcionando", data: "2026-11-23" }
    ];

    const RMS_INICIAL = [
      { id: 1, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 5, descricao: "TECLADO", data: "2026-11-10", setor: "ENESA", obra: "124", status: "SEPARAÇÃO NA BAIA", rms: "119370", idProduto: "11909" },
      { id: 2, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 5, descricao: "MOUSER", data: "2026-11-17", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "11795" },
      { id: 3, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 5, descricao: "TECLADO", data: "2026-11-18", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "11909" },
      { id: 4, patrimonio: "02569-0762", patrimonio2: "", qtd: 1, descricao: "MONITOR", data: "2026-11-18", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "17351" },
      { id: 5, patrimonio: "02569-1170", patrimonio2: "", qtd: 1, descricao: "MONITOR", data: "2026-11-18", setor: "ENESA", obra: "126", status: "SEPARAÇÃO NA BAIA", rms: "119555", idProduto: "17351" },
      { id: 6, patrimonio: "Não Relacionado", patrimonio2: "", qtd: 10, descricao: "MOUSER", data: "2026-11-23", setor: "ENESA", obra: "129", status: "SEPARAÇÃO NA BAIA", rms: "120012", idProduto: "11795" }
    ];

    function carregarListaSegura(chave, padrao) {
      try {
        const salvo = localStorage.getItem(chave);
        if (!salvo) return padrao;
        const parsed = JSON.parse(salvo);
        return Array.isArray(parsed) && parsed.length > 0 ? parsed : padrao;
      } catch (e) {
        return padrao;
      }
    }

    function formatarDataBR(isoDate) {
      if (!isoDate) return "";
      const partes = String(isoDate).split("-");
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return isoDate;
    }

    function converterDataParaISO(valor) {
      if (!valor) return hojeISO();
      if (typeof valor === "number") {
        const utcDays = Math.floor(valor - 25569);
        const dt = new Date(utcDays * 86400 * 1000);
        const yyyy = dt.getUTCFullYear();
        const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
        const dd = String(dt.getUTCDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }
      const str = String(valor).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      const partesBR = str.split("/");
      if (partesBR.length === 3) {
        const dd = partesBR[0].padStart(2, "0");
        const mm = partesBR[1].padStart(2, "0");
        const yyyy = partesBR[2].length === 2 ? `20${partesBR[2]}` : partesBR[2];
        return `${yyyy}-${mm}-${dd}`;
      }
      return hojeISO();
    }

    function hojeISO() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${d.getFullYear()}-${mm}-${dd}`;
    }

    function temPatrimonioValido(pat) {
      const txt = String(pat || "").trim();
      if (!txt) return false;
      const lower = txt.toLowerCase();
      return !lower.includes("não relacionado") && !lower.includes("nao relacionado") && !lower.includes("não informado") && !lower.includes("nao informado");
    }

    function formatarPatrimonioAuto(valor, anterior) {
      const limpo = String(valor || "").trim();
      if (/^\d{4}$/.test(limpo)) {
        let prefixo = "02562-";
        if (anterior && anterior.patrimonio && anterior.patrimonio.includes("-")) {
          prefixo = anterior.patrimonio.slice(0, anterior.patrimonio.indexOf("-") + 1);
        }
        return `${prefixo}${limpo}`;
      }
      if (/^\d{4,5}$/.test(limpo) && !limpo.includes("-")) {
        return limpo.length === 4 ? `0${limpo}-` : `${limpo}-`;
      }
      return valor;
    }

    function parsearDadosQR(textoBruto) {
      const raw = String(textoBruto || "").trim();
      if (!raw) return { pat: "", rm: "", termoFiltro: "" };

      const patMatch = raw.match(/PAT\s*:\s*([^|]+)/i);
      const rmMatch = raw.match(/RM\s*:\s*([^|]+)/i);

      const pat = patMatch ? patMatch[1].trim() : "";
      const rm = rmMatch ? rmMatch[1].trim() : "";

      const patLimpo = temPatrimonioValido(pat) ? pat : "";
      const termoFiltro = patLimpo || rm || raw;

      return { pat: patLimpo, rm, termoFiltro };
    }

    function formatarStatusEtiqueta(statusBruto) {
      const limpo = String(statusBruto || "").trim();
      if (!limpo) return "";
      if (/^status\s*:/i.test(limpo)) return limpo;
      return `STATUS: ${limpo}`;
    }

    // Converte um item de Inventário TI para o formato unificado da etiqueta (EQP no header)
    function itemInventarioParaEtiqueta(row) {
      return {
        id: row.id,
        origem: "INVENTARIO_TI",
        tituloTopo: `EQP: ${row.id}`,
        patrimonio: row.patrimonio || "Não Relacionado",
        linhaResumo: `${row.tipo || "EQP"}: ${row.modelo || ""} (${row.processador || ""} | ${row.ram || ""} | ${row.armazenamento || ""})`,
        linhaDetalhe: `LOCAL: ${row.localEqp || "TI"} | DATA: ${formatarDataBR(row.data)}`,
        status: formatarStatusEtiqueta(row.status),
        qrTexto: `PAT: ${temPatrimonioValido(row.patrimonio) ? String(row.patrimonio).trim() : "Não Relacionado"} | EQP: ${row.id}`
      };
    }

    // Converte um item de RMS_OBRAS para o formato unificado da etiqueta
    function itemRmsParaEtiqueta(row) {
      return {
        id: row.id,
        origem: "RMS_OBRAS",
        tituloTopo: `OBRA: ${row.obra || ""}`,
        patrimonio: row.patrimonio || "Não Relacionado",
        linhaResumo: `QTD: ${row.qtd} ( ${row.descricao}) DATA: ${formatarDataBR(row.data)} / ${row.setor}`,
        linhaDetalhe: `RM: ${row.rms} | ID do Produto: ${row.idProduto}`,
        status: formatarStatusEtiqueta(row.status),
        qrTexto: `PAT: ${temPatrimonioValido(row.patrimonio) ? String(row.patrimonio).trim() : "Não Relacionado"} | RM: ${String(row.rms || "").trim()}`
      };
    }

    function App() {
      const [aba, setAba] = useState("Inventário TI");
      const [origemEtiqueta, setOrigemEtiqueta] = useState("INVENTARIO_TI");

      const [inventario, setInventario] = useState(() => carregarListaSegura("inventario_ti_itens_v1", INVENTARIO_INICIAL));
      const [itensRms, setItensRms] = useState(() => carregarListaSegura("rms_obras_itens_v1", RMS_INICIAL));

      const [pesquisaInv, setPesquisaInv] = useState("");
      const [pesquisaRms, setPesquisaRms] = useState("");

      const [linhaSelecionadaInv, setLinhaSelecionadaInv] = useState(() => {
        const ini = carregarListaSegura("inventario_ti_itens_v1", INVENTARIO_INICIAL);
        return ini[0] ? ini[0].id : "";
      });
      const [linhaSelecionadaRms, setLinhaSelecionadaRms] = useState(() => {
        const ini = carregarListaSegura("rms_obras_itens_v1", RMS_INICIAL);
        return ini.some((r) => String(r.id) === "4") ? 4 : (ini[0] ? ini[0].id : "");
      });

      const [eqpSelecionado, setEqpSelecionado] = useState(() => {
        const ini = carregarListaSegura("inventario_ti_itens_v1", INVENTARIO_INICIAL);
        return ini[0] ? ini[0].id : 1;
      });
      const [codBarrasInput, setCodBarrasInput] = useState("");
      const [aviso, setAviso] = useState("");
      const [statusLeitura, setStatusLeitura] = useState("");
      const [cameraAtiva, setCameraAtiva] = useState(false);

      const barcodeRef = useRef(null);
      const qrRef = useRef(null);
      const bipInputRef = useRef(null);
      const fileInvRef = useRef(null);
      const fileRmsRef = useRef(null);
      const scannerInstanceRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem("inventario_ti_itens_v1", JSON.stringify(inventario));
        } catch (e) {}
      }, [inventario]);

      useEffect(() => {
        try {
          localStorage.setItem("rms_obras_itens_v1", JSON.stringify(itensRms));
        } catch (e) {}
      }, [itensRms]);

      const listaAtivaEtiqueta = origemEtiqueta === "INVENTARIO_TI" ? inventario : itensRms;
      const registroBrutoEtq = listaAtivaEtiqueta.find((r) => String(r.id) === String(eqpSelecionado)) || null;
      const itemEtiqueta = registroBrutoEtq
        ? (origemEtiqueta === "INVENTARIO_TI"
            ? itemInventarioParaEtiqueta(registroBrutoEtq)
            : itemRmsParaEtiqueta(registroBrutoEtq))
        : null;
      const patValido = itemEtiqueta ? temPatrimonioValido(itemEtiqueta.patrimonio) : false;

      // Filtro Inventário TI
      const termoInv = pesquisaInv.trim().toLowerCase();
      const inventarioFiltrado = inventario
        .map((row, index) => ({ row, index }))
        .filter(({ row }) => {
          if (!termoInv) return true;
          const campos = [
            row.id,
            row.patrimonio,
            row.patrimonio2,
            row.tipo,
            row.modelo,
            row.processador,
            row.ram,
            row.armazenamento,
            row.localEqp,
            row.status,
            row.data,
            formatarDataBR(row.data)
          ];
          return campos.some((val) => String(val ?? "").toLowerCase().includes(termoInv));
        });

      // Filtro RMS_OBRAS
      const termoRms = pesquisaRms.trim().toLowerCase();
      const rmsFiltrado = itensRms
        .map((row, index) => ({ row, index }))
        .filter(({ row }) => {
          if (!termoRms) return true;
          const campos = [
            row.id,
            row.patrimonio,
            row.patrimonio2,
            row.qtd,
            row.descricao,
            row.data,
            formatarDataBR(row.data),
            row.setor,
            row.obra,
            row.status,
            row.rms,
            row.idProduto
          ];
          return campos.some((val) => String(val ?? "").toLowerCase().includes(termoRms));
        });

      function aplicarBuscaESelecao(dadosQR, abaAlvo) {
        const { pat, rm, termoFiltro } = dadosQR;
        const busca = String(termoFiltro || pat || rm || "").trim();

        if (abaAlvo === "Inventário TI") {
          setPesquisaInv(busca);
          const encontrado = inventario.find((r) => {
            if (pat && String(r.patrimonio || "").trim().toLowerCase() === pat.toLowerCase()) return true;
            if (pat && String(r.patrimonio2 || "").trim().toLowerCase() === pat.toLowerCase()) return true;
            if (busca && (
              String(r.patrimonio || "").trim().toLowerCase().includes(busca.toLowerCase()) ||
              String(r.modelo || "").trim().toLowerCase().includes(busca.toLowerCase()) ||
              String(r.id) === busca
            )) return true;
            return false;
          });
          if (encontrado) {
            setLinhaSelecionadaInv(encontrado.id);
            setEqpSelecionado(encontrado.id);
            setOrigemEtiqueta("INVENTARIO_TI");
            setAviso("");
            setStatusLeitura(
              `Selecionado: EQP ${encontrado.id} — ${encontrado.tipo || ""} ${encontrado.modelo || ""} (PAT: ${encontrado.patrimonio || "-"})`
            );
          } else {
            setAviso(`Pesquisa aplicada com "${busca}", mas nenhum EQP foi encontrado no Inventário TI.`);
            setStatusLeitura("");
          }
        } else {
          setPesquisaRms(busca);
          const encontrado = itensRms.find((r) => {
            if (pat && String(r.patrimonio || "").trim().toLowerCase() === pat.toLowerCase()) return true;
            if (rm && String(r.rms || "").trim().toLowerCase() === rm.toLowerCase()) return true;
            return false;
          });
          if (encontrado) {
            setLinhaSelecionadaRms(encontrado.id);
            setEqpSelecionado(encontrado.id);
            setOrigemEtiqueta("RMS_OBRAS");
            setAviso("");
            setStatusLeitura(
              `Selecionado: EQP ${encontrado.id} — ${encontrado.descricao || "Item"} (PAT: ${encontrado.patrimonio || "-"} | RM: ${encontrado.rms || "-"})`
            );
          } else {
            setAviso(`Pesquisa aplicada com "${busca}", mas nenhum item foi encontrado na RMS_OBRAS.`);
            setStatusLeitura("");
          }
        }
      }

      // Câmera QR Code na aba ativa
      useEffect(() => {
        if (!cameraAtiva || (aba !== "Inventário TI" && aba !== "RMS_OBRAS")) {
          if (scannerInstanceRef.current) {
            scannerInstanceRef.current.stop().catch(() => {}).finally(() => {
              scannerInstanceRef.current = null;
            });
          }
          return;
        }

        if (typeof Html5Qrcode === "undefined") {
          setAviso("Biblioteca da câmera não carregou. Verifique a conexão com a internet.");
          setCameraAtiva(false);
          return;
        }

        const containerId = aba === "Inventário TI" ? "qr-reader-inv" : "qr-reader-rms";
        const html5QrCode = new Html5Qrcode(containerId);
        scannerInstanceRef.current = html5QrCode;

        html5QrCode
          .start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            (decodedText) => {
              const dados = parsearDadosQR(decodedText);
              aplicarBuscaESelecao(dados, aba);
              setCameraAtiva(false);
            },
            () => {}
          )
          .catch(() => {
            setAviso("Não foi possível acessar a câmera. Permita o uso da câmera no navegador ou use em HTTPS.");
            setCameraAtiva(false);
          });

        return () => {
          if (scannerInstanceRef.current) {
            scannerInstanceRef.current.stop().catch(() => {}).finally(() => {
              scannerInstanceRef.current = null;
            });
          }
        };
      }, [cameraAtiva, aba]);

      // Code 128 + QR Code na etiqueta
      useEffect(() => {
        if (aba !== "Etiqueta") return;

        if (barcodeRef.current) {
          barcodeRef.current.innerHTML = "";
          if (itemEtiqueta) {
            if (patValido) {
              const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
              barcodeRef.current.appendChild(svg);
              try {
                JsBarcode(svg, `${itemEtiqueta.id}-${String(itemEtiqueta.patrimonio).trim()}`, {
                  format: "CODE128",
                  width: 1.5,
                  height: 28,
                  displayValue: false,
                  margin: 1
                });
              } catch (e) {
                barcodeRef.current.innerHTML = `<span class="etq-sem-pat">Sem código de barras</span>`;
              }
            } else {
              barcodeRef.current.innerHTML = `<span class="etq-sem-pat">Patrimônio não relacionado (sem código de barras)</span>`;
            }
          }
        }

        if (qrRef.current) {
          qrRef.current.innerHTML = "";
          if (itemEtiqueta && typeof QRCode !== "undefined") {
            try {
              new QRCode(qrRef.current, {
                text: itemEtiqueta.qrTexto,
                width: 96,
                height: 96,
                correctLevel: QRCode.CorrectLevel.L
              });
            } catch (e) {}
          }
        }
      }, [aba, itemEtiqueta, patValido]);

      // Funções Inventário TI
      function atualizarCampoInv(index, campo, valor) {
        setInventario((prev) => {
          const copia = [...prev];
          const anterior = index > 0 ? copia[index - 1] : null;
          let novoValor = valor;

          if (campo === "patrimonio" || campo === "patrimonio2") {
            novoValor = formatarPatrimonioAuto(valor, anterior);
            if (campo === "patrimonio" && String(valor).trim() !== "" && anterior) {
              if (!copia[index].tipo) copia[index].tipo = anterior.tipo || "CPU";
              if (!copia[index].modelo) copia[index].modelo = anterior.modelo || "";
              if (!copia[index].processador) copia[index].processador = anterior.processador || "";
              if (!copia[index].localEqp) copia[index].localEqp = anterior.localEqp || "TI.09A2";
              if (!copia[index].status) copia[index].status = anterior.status || "Em estoque Funcionando";
              if (!copia[index].data) copia[index].data = hojeISO();
            }
          }

          copia[index] = { ...copia[index], [campo]: novoValor };
          return copia;
        });
      }

      function adicionarLinhaInv() {
        setInventario((prev) => {
          const ultimo = prev[prev.length - 1];
          const proximoId = prev.reduce((max, r) => Math.max(max, Number(r.id) || 0), 0) + 1;
          return [
            ...prev,
            {
              id: proximoId,
              patrimonio: "",
              patrimonio2: "",
              tipo: ultimo ? ultimo.tipo : "CPU",
              modelo: ultimo ? ultimo.modelo : "",
              processador: ultimo ? ultimo.processador : "",
              ram: "",
              armazenamento: "",
              localEqp: ultimo ? ultimo.localEqp : "TI.09A2",
              status: ultimo ? ultimo.status : "Em estoque Funcionando",
              data: hojeISO()
            }
          ];
        });
      }

      function excluirLinhaInv(index) {
        setInventario((prev) => {
          const removida = prev[index];
          const restante = prev.filter((_, i) => i !== index);
          if (removida && origemEtiqueta === "INVENTARIO_TI" && String(removida.id) === String(eqpSelecionado)) {
            setEqpSelecionado(restante.length > 0 ? restante[0].id : "");
          }
          if (removida && String(removida.id) === String(linhaSelecionadaInv)) {
            setLinhaSelecionadaInv(restante.length > 0 ? restante[0].id : null);
          }
          return restante;
        });
      }

      function executarAcaoInv(acao, row, index) {
        if (acao === "etiqueta") {
          setOrigemEtiqueta("INVENTARIO_TI");
          setEqpSelecionado(row.id);
          setLinhaSelecionadaInv(row.id);
          setAviso("");
          setAba("Etiqueta");
        } else if (acao === "excluir") {
          excluirLinhaInv(index);
        }
      }

      function importarExcelInv(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const nomeAba = workbook.SheetNames.find((n) => n.toLowerCase().includes("invent")) || workbook.SheetNames[0];
            const ws = workbook.Sheets[nomeAba];
            const linhas = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

            const idxCab = linhas.findIndex((row) =>
              row.some((c) => ["eqp", "id"].includes(String(c).trim().toLowerCase())) &&
              row.some((c) => String(c).trim().toLowerCase().includes("patrimonio"))
            );

            let linhasDados = [];
            if (idxCab >= 0) {
              const cab = linhas[idxCab].map((h) => String(h).trim().toLowerCase());
              const colIdx = (nomes) => cab.findIndex((c) => nomes.some((n) => c.includes(n)));

              const iEqp = cab.findIndex((c) => c === "eqp" || c === "id");
              const iPat2 = colIdx(["patrimonio2"]);
              const iPat = iPat2 >= 0
                ? cab.findIndex((x) => x.includes("patrimonio") && !x.includes("2"))
                : colIdx(["patrimonio"]);
              const iTipo = colIdx(["tipo"]);
              const iModelo = colIdx(["modelo"]);
              const iProc = colIdx(["processador"]);
              const iRam = colIdx(["ram"]);
              const iArm = colIdx(["armazenamento"]);
              const iLocal = colIdx(["local"]);
              const iStatus = colIdx(["status"]);
              const iData = colIdx(["data"]);

              linhasDados = linhas.slice(idxCab + 1)
                .filter((r) => r.some((v) => String(v).trim() !== ""))
                .map((r, pos) => ({
                  id: iEqp >= 0 && String(r[iEqp]).trim() !== "" ? Number(r[iEqp]) || (pos + 1) : (pos + 1),
                  patrimonio: iPat >= 0 ? String(r[iPat]).trim() : "",
                  patrimonio2: iPat2 >= 0 ? String(r[iPat2]).trim() : "",
                  tipo: iTipo >= 0 ? String(r[iTipo]).trim() : "CPU",
                  modelo: iModelo >= 0 ? String(r[iModelo]).trim() : "",
                  processador: iProc >= 0 ? String(r[iProc]).trim() : "",
                  ram: iRam >= 0 ? String(r[iRam]).trim() : "",
                  armazenamento: iArm >= 0 ? String(r[iArm]).trim() : "",
                  localEqp: iLocal >= 0 ? String(r[iLocal]).trim() : "TI.09A2",
                  status: iStatus >= 0 ? String(r[iStatus]).trim() : "Em estoque Funcionando",
                  data: iData >= 0 ? converterDataParaISO(r[iData]) : hojeISO()
                }));
            }

            if (linhasDados.length === 0) {
              setAviso("Nenhum item válido encontrado na planilha do Inventário TI.");
              return;
            }

            setInventario(linhasDados);
            setLinhaSelecionadaInv(linhasDados[0].id);
            if (origemEtiqueta === "INVENTARIO_TI") setEqpSelecionado(linhasDados[0].id);
            setAviso(`Importados ${linhasDados.length} itens no Inventário TI (${file.name}).`);
          } catch (err) {
            setAviso("Erro ao ler o arquivo Excel do Inventário TI.");
          } finally {
            event.target.value = "";
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function processarLeituraCodigoBarras(valorBruto) {
        const lido = String(valorBruto || "").trim();
        if (!lido) return;

        let achado = null;
        if (lido.includes("-") && lido.length > 6) {
          const partes = lido.split("-");
          if (partes.length >= 3) {
            const patBusca = `${partes[1]}-${partes[2]}`;
            achado = listaAtivaEtiqueta.find((r) => String(r.patrimonio).trim() === patBusca);
          }
          if (!achado && !isNaN(Number(partes[0]))) {
            achado = listaAtivaEtiqueta.find((r) => Number(r.id) === Number(partes[0]));
          }
        } else if (lido.includes("-")) {
          achado = listaAtivaEtiqueta.find((r) => String(r.patrimonio).trim() === lido);
        } else {
          achado = listaAtivaEtiqueta.find((r) => String(r.id).trim() === lido);
        }

        if (achado) {
          setEqpSelecionado(achado.id);
          if (origemEtiqueta === "INVENTARIO_TI") setLinhaSelecionadaInv(achado.id);
          else setLinhaSelecionadaRms(achado.id);
          setAviso("");
        } else {
          setAviso(`Código '${lido}' não encontrado na lista selecionada.`);
        }

        setCodBarrasInput("");
        setTimeout(() => {
          if (bipInputRef.current) bipInputRef.current.focus();
        }, 10);
      }

      function imprimirEtiqueta() {
        if (!itemEtiqueta) {
          alert(`O EQP ${eqpSelecionado} não foi encontrado.`);
          return;
        }
        window.print();
      }

      return (
        <div>
          <div className="topbar">
            <strong>INVENTÁRIO TI & RMS OBRAS</strong>
            <button
              className={aba === "Inventário TI" ? "active" : ""}
              onClick={() => {
                setCameraAtiva(false);
                setAviso("");
                setStatusLeitura("");
                setAba("Inventário TI");
              }}
            >
              Inventário TI
            </button>
            <button
              className={aba === "RMS_OBRAS" ? "active" : ""}
              onClick={() => {
                setCameraAtiva(false);
                setAviso("");
                setStatusLeitura("");
                setAba("RMS_OBRAS");
              }}
            >
              RMS_OBRAS
            </button>
            <button
              className={aba === "Etiqueta" ? "active" : ""}
              onClick={() => {
                setCameraAtiva(false);
                setAba("Etiqueta");
              }}
            >
              Etiqueta
            </button>
          </div>

          <div className="container">
            {aba === "Inventário TI" && (
              <div className="card">
                <div className="banner">RELAÇÃO DE INVENTÁRIO - ESTOQUE DE TI</div>
                <div className="toolbar-rms">
                  <input
                    type="text"
                    className="search-box"
                    placeholder="Pesquisar em qualquer coluna (EQP, Patrimônio, Tipo, Modelo, Processador, RAM, Local, Status...)"
                    value={pesquisaInv}
                    onChange={(e) => {
                      const val = e.target.value;
                      setPesquisaInv(val);
                      if (!val.trim()) setStatusLeitura("");
                    }}
                  />
                  <button
                    type="button"
                    className="btn-cam"
                    onClick={() => {
                      setAviso("");
                      setCameraAtiva((prev) => !prev);
                    }}
                  >
                    {cameraAtiva ? "Fechar Câmera" : "Ler QR Code / Câmera"}
                  </button>
                  {pesquisaInv && (
                    <button
                      type="button"
                      className="btn-clear"
                      onClick={() => {
                        setPesquisaInv("");
                        setStatusLeitura("");
                        setAviso("");
                      }}
                    >
                      Limpar
                    </button>
                  )}
                  <span className="contador-filtro">
                    Exibindo {inventarioFiltrado.length} de {inventario.length}
                  </span>
                </div>

                {cameraAtiva && (
                  <div className="scanner-box">
                    <div className="scanner-header">
                      <strong>Aponte a câmera para o QR Code da etiqueta</strong>
                      <button type="button" className="btn-clear" onClick={() => setCameraAtiva(false)}>
                        Cancelar
                      </button>
                    </div>
                    <div id="qr-reader-inv"></div>
                  </div>
                )}

                <div style={{ marginTop: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button className="btn-add" onClick={adicionarLinhaInv}>+ Nova Linha</button>
                  <button className="btn-import" onClick={() => fileInvRef.current && fileInvRef.current.click()}>
                    Importar Excel (.xlsx)
                  </button>
                  <input
                    ref={fileInvRef}
                    type="file"
                    accept=".xlsx,.xls,.xlsm,.csv"
                    style={{ display: "none" }}
                    onChange={importarExcelInv}
                  />
                  <button className="btn-excel" onClick={exportarExcelInv}>Exportar Excel (.xlsx)</button>
                  <button
                    className="btn-reset"
                    onClick={() => {
                      try { localStorage.removeItem("inventario_ti_itens_v1"); } catch (e) {}
                      setInventario(INVENTARIO_INICIAL);
                      setPesquisaInv("");
                      setStatusLeitura("");
                      setAviso("");
                    }}
                  >
                    Restaurar Exemplo Inicial
                  </button>
                </div>

                {statusLeitura && <div className="msg-sucesso">{statusLeitura}</div>}
                {aviso && <div className="msg-alerta">{aviso}</div>}

                <table>
                  <thead>
                    <tr>
                      <th>EQP</th>
                      <th>Patrimonio</th>
                      <th>Patrimonio2</th>
                      <th>Tipo</th>
                      <th>modelo</th>
                      <th>Processador</th>
                      <th>Ram</th>
                      <th>Armazenamento</th>
                      <th>Local EQP</th>
                      <th>Status</th>
                      <th>Data</th>
                      <th>Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {inventarioFiltrado.map(({ row, index }) => {
                      const selecionada = String(row.id) === String(linhaSelecionadaInv);
                      return (
                        <tr
                          key={row.id}
                          className={selecionada ? "linha-selecionada" : ""}
                          onClick={() => {
                            setLinhaSelecionadaInv(row.id);
                            setOrigemEtiqueta("INVENTARIO_TI");
                            setEqpSelecionado(row.id);
                          }}
                        >
                          <td>{row.id}</td>
                          <td>
                            <input
                              value={row.patrimonio}
                              placeholder="Ex: 1298 ou 02562-1298"
                              onChange={(e) => atualizarCampoInv(index, "patrimonio", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.patrimonio2}
                              onChange={(e) => atualizarCampoInv(index, "patrimonio2", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.tipo}
                              onChange={(e) => atualizarCampoInv(index, "tipo", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.modelo}
                              onChange={(e) => atualizarCampoInv(index, "modelo", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.processador}
                              onChange={(e) => atualizarCampoInv(index, "processador", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.ram}
                              onChange={(e) => atualizarCampoInv(index, "ram", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.armazenamento}
                              onChange={(e) => atualizarCampoInv(index, "armazenamento", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.localEqp}
                              onChange={(e) => atualizarCampoInv(index, "localEqp", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.status}
                              onChange={(e) => atualizarCampoInv(index, "status", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              type="date"
                              value={row.data}
                              onChange={(e) => atualizarCampoInv(index, "data", e.target.value)}
                            />
                          </td>
                          <td onClick={(e) => e.stopPropagation()}>
                            <select
                              className="acao-select"
                              value=""
                              onChange={(e) => {
                                const escolha = e.target.value;
                                e.target.value = "";
                                executarAcaoInv(escolha, row, index);
                              }}
                            >
                              <option value="" disabled>Ação...</option>
                              <option value="etiqueta">Etiqueta</option>
                              <option value="excluir">Excluir</option>
                            </select>
                          </td>
                        </tr>
                      );
                    })}
                    {inventarioFiltrado.length === 0 && (
                      <tr>
                        <td colSpan="12" style={{ padding: 14, color: "#64748b" }}>
                          Nenhum registro encontrado para "{pesquisaInv}".
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {aba === "RMS_OBRAS" && (
              <div className="card">
                <div className="banner">RELAÇÃO ATENDIMENTO - RMS OBRAS</div>
                <div className="toolbar-rms">
                  <input
                    type="text"
                    className="search-box"
                    placeholder="Pesquisar em qualquer coluna (ID, Patrimônio, Descrição, Obra, RMS, ID Produto, Status...)"
                    value={pesquisaRms}
                    onChange={(e) => {
                      const val = e.target.value;
                      setPesquisaRms(val);
                      if (!val.trim()) setStatusLeitura("");
                    }}
                  />
                  <button
                    type="button"
                    className="btn-cam"
                    onClick={() => {
                      setAviso("");
                      setCameraAtiva((prev) => !prev);
                    }}
                  >
                    {cameraAtiva ? "Fechar Câmera" : "Ler QR Code / Câmera"}
                  </button>
                  {pesquisaRms && (
                    <button
                      type="button"
                      className="btn-clear"
                      onClick={() => {
                        setPesquisaRms("");
                        setStatusLeitura("");
                        setAviso("");
                      }}
                    >
                      Limpar
                    </button>
                  )}
                  <span className="contador-filtro">
                    Exibindo {rmsFiltrado.length} de {itensRms.length}
                  </span>
                </div>

                {cameraAtiva && (
                  <div className="scanner-box">
                    <div className="scanner-header">
                      <strong>Aponte a câmera para o QR Code da etiqueta</strong>
                      <button type="button" className="btn-clear" onClick={() => setCameraAtiva(false)}>
                        Cancelar
                      </button>
                    </div>
                    <div id="qr-reader-rms"></div>
                  </div>
                )}

                <div style={{ marginTop: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button className="btn-add" onClick={adicionarLinhaRms}>+ Nova Linha</button>
                  <button className="btn-import" onClick={() => fileRmsRef.current && fileRmsRef.current.click()}>
                    Importar Excel (.xlsx)
                  </button>
                  <input
                    ref={fileRmsRef}
                    type="file"
                    accept=".xlsx,.xls,.xlsm,.csv"
                    style={{ display: "none" }}
                    onChange={importarExcelRms}
                  />
                  <button className="btn-excel" onClick={exportarExcelRms}>Exportar Excel (.xlsx)</button>
                  <button
                    className="btn-reset"
                    onClick={() => {
                      try { localStorage.removeItem("rms_obras_itens_v1"); } catch (e) {}
                      setItensRms(RMS_INICIAL);
                      setPesquisaRms("");
                      setStatusLeitura("");
                      setAviso("");
                    }}
                  >
                    Restaurar Exemplo Inicial
                  </button>
                </div>

                {statusLeitura && <div className="msg-sucesso">{statusLeitura}</div>}
                {aviso && <div className="msg-alerta">{aviso}</div>}

                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Patrimonio</th>
                      <th>Patrimonio2</th>
                      <th>QTD:</th>
                      <th>DESCRIÇÃO</th>
                      <th>DATA:</th>
                      <th>SETOR</th>
                      <th>OBRA</th>
                      <th>STATUS</th>
                      <th>RMS</th>
                      <th>ID PRODUTO</th>
                      <th>Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rmsFiltrado.map(({ row, index }) => {
                      const selecionada = String(row.id) === String(linhaSelecionadaRms);
                      return (
                        <tr
                          key={row.id}
                          className={selecionada ? "linha-selecionada" : ""}
                          onClick={() => {
                            setLinhaSelecionadaRms(row.id);
                            setOrigemEtiqueta("RMS_OBRAS");
                            setEqpSelecionado(row.id);
                          }}
                        >
                          <td>{row.id}</td>
                          <td>
                            <input
                              value={row.patrimonio}
                              placeholder="Ex: 1450 ou 02569-0762"
                              onChange={(e) => atualizarCampoRms(index, "patrimonio", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.patrimonio2}
                              onChange={(e) => atualizarCampoRms(index, "patrimonio2", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              type="number"
                              value={row.qtd}
                              onChange={(e) => atualizarCampoRms(index, "qtd", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.descricao}
                              onChange={(e) => atualizarCampoRms(index, "descricao", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              type="date"
                              value={row.data}
                              onChange={(e) => atualizarCampoRms(index, "data", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.setor}
                              onChange={(e) => atualizarCampoRms(index, "setor", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.obra}
                              onChange={(e) => atualizarCampoRms(index, "obra", e.target.value)}
                            />
                          </td>
                          <td>
                            <select
                              className={row.status === "SEPARAÇÃO SEM LISTA" ? "status-semlista" : "status-baia"}
                              value={row.status}
                              onChange={(e) => atualizarCampoRms(index, "status", e.target.value)}
                            >
                              <option value="SEPARAÇÃO NA BAIA">SEPARAÇÃO NA BAIA</option>
                              <option value="SEPARAÇÃO SEM LISTA">SEPARAÇÃO SEM LISTA</option>
                            </select>
                          </td>
                          <td>
                            <input
                              value={row.rms}
                              onChange={(e) => atualizarCampoRms(index, "rms", e.target.value)}
                            />
                          </td>
                          <td>
                            <input
                              value={row.idProduto}
                              onChange={(e) => atualizarCampoRms(index, "idProduto", e.target.value)}
                            />
                          </td>
                          <td onClick={(e) => e.stopPropagation()}>
                            <select
                              className="acao-select"
                              value=""
                              onChange={(e) => {
                                const escolha = e.target.value;
                                e.target.value = "";
                                executarAcaoRms(escolha, row, index);
                              }}
                            >
                              <option value="" disabled>Ação...</option>
                              <option value="etiqueta">Etiqueta</option>
                              <option value="excluir">Excluir</option>
                            </select>
                          </td>
                        </tr>
                      );
                    })}
                    {rmsFiltrado.length === 0 && (
                      <tr>
                        <td colSpan="12" style={{ padding: 14, color: "#64748b" }}>
                          Nenhum registro encontrado para "{pesquisaRms}".
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {aba === "Etiqueta" && (
              <div className="card">
                <div className="controls-row no-print">
                  <label>Origem:</label>
                  <select
                    value={origemEtiqueta}
                    onChange={(e) => {
                      const novaOrigem = e.target.value;
                      setOrigemEtiqueta(novaOrigem);
                      const base = novaOrigem === "INVENTARIO_TI" ? inventario : itensRms;
                      if (base.length > 0) setEqpSelecionado(base[0].id);
                    }}
                  >
                    <option value="INVENTARIO_TI">Inventário TI</option>
                    <option value="RMS_OBRAS">RMS_OBRAS</option>
                  </select>

                  <label>EQP Selecionado:</label>
                  <input
                    type="number"
                    className="hl-yellow"
                    style={{ width: 70, textAlign: "center" }}
                    value={eqpSelecionado}
                    onChange={(e) => setEqpSelecionado(e.target.value)}
                  />

                  <select
                    value={registroBrutoEtq ? String(registroBrutoEtq.id) : ""}
                    onChange={(e) => setEqpSelecionado(e.target.value)}
                    title="Escolha rápida"
                  >
                    {listaAtivaEtiqueta.map((r) => (
                      <option key={r.id} value={String(r.id)}>
                        EQP {r.id} — {r.modelo || r.descricao || "Item"} ({r.patrimonio || "Sem Pat."})
                      </option>
                    ))}
                  </select>

                  <label>Cod Barras Selecionado:</label>
                  <input
                    ref={bipInputRef}
                    className="hl-yellow"
                    style={{ width: 190 }}
                    placeholder="Bipe ou digite e dê Enter"
                    value={codBarrasInput}
                    onChange={(e) => setCodBarrasInput(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        processarLeituraCodigoBarras(codBarrasInput);
                      }
                    }}
                  />
                  <button onClick={() => processarLeituraCodigoBarras(codBarrasInput)}>Buscar</button>
                </div>

                {aviso && <div className="msg-alerta no-print">{aviso}</div>}

                {itemEtiqueta ? (
                  <div className="etiqueta-box">
                    <div className="etq-obra">{itemEtiqueta.tituloTopo}</div>
                    <div className="etq-barcode" ref={barcodeRef}></div>
                    <div className="etq-body-row">
                      <div className="etq-info">
                        <div className="etq-pat">Patrimônio: {itemEtiqueta.patrimonio}</div>
                        <div className="etq-sub">{itemEtiqueta.linhaResumo}</div>
                        <div className="etq-rm">{itemEtiqueta.linhaDetalhe}</div>
                        <div className="etq-status">{itemEtiqueta.status}</div>
                      </div>
                      <div className="etq-qr-area">
                        <div ref={qrRef}></div>
                      </div>
                    </div>
                    <div className="etq-footer">★ CONFERIDO POR EMERSON ★</div>
                  </div>
                ) : (
                  <div className="msg-alerta">EQP "{eqpSelecionado}" não encontrado.</div>
                )}

                <div className="no-print">
                  <button className="btn-print" onClick={imprimirEtiqueta}>
                    IMPRIMIR EQP ETIQUETA
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
